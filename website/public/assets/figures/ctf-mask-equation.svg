<svg xmlns="http://www.w3.org/2000/svg" width="760" height="475" aria-labelledby="title desc" role="img" viewBox="0 0 760 475"><title id="title">One check reveals one character</title><desc id="desc">The seventh mask selects only position 21 in the six by six input grid. Its character code must equal 55, so the character is 7. The other masks select different positions and give further equations.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8191a2" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>@media (prefers-color-scheme:dark){svg{background-color:#181825}[fill=&quot;#20252b&quot;]{fill:#cdd6f4}[fill=&quot;#294f82&quot;]{fill:#89b4fa}[stroke=&quot;#294f82&quot;]{stroke:#89b4fa}[fill=&quot;#5b6570&quot;]{fill:#a6adc8}[fill=&quot;#7a8490&quot;]{fill:#9399b2}[fill=&quot;#8191a2&quot;]{fill:#7f849c}[stroke=&quot;#8191a2&quot;]{stroke:#7f849c}[stroke=&quot;#e0e5e9&quot;]{stroke:#45475a}[fill=&quot;#edf2f8&quot;]{fill:#313244}[fill=&quot;#f4f6f8&quot;]{fill:#1e1e2e}[fill=&quot;#fafbfc&quot;]{fill:#11111b}[fill=&quot;#ffffff&quot;]{fill:#181825}}</style><rect width="760" height="475" fill="#fff"/><g fill="#20252b" font-family="system-ui, -apple-system, sans-serif" font-size="14"><text x="32" y="36" font-size="19" font-weight="600">One check reveals one character</text><text x="32" y="63" fill="#5b6570">The seventh check. Cell labels are input positions, starting at 0.</text><rect width="696" height="43" x="32" y="87" fill="#f4f6f8" stroke="#e0e5e9" rx="4"/><text x="48" y="114" font-family="monospace">Encoded mask: −21, +1, −14, 0</text><text x="32" y="149" fill="#5b6570">Skip 21 cells. Select 1. Skip 14. Stop at 0.</text><rect width="38" height="34" x="32" y="160" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="51" y="183" fill="#7a8490" text-anchor="middle">00</text><rect width="38" height="34" x="76" y="160" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="95" y="183" fill="#7a8490" text-anchor="middle">01</text><rect width="38" height="34" x="120" y="160" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="139" y="183" fill="#7a8490" text-anchor="middle">02</text><rect width="38" height="34" x="164" y="160" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="183" y="183" fill="#7a8490" text-anchor="middle">03</text><rect width="38" height="34" x="208" y="160" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="227" y="183" fill="#7a8490" text-anchor="middle">04</text><rect width="38" height="34" x="252" y="160" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="271" y="183" fill="#7a8490" text-anchor="middle">05</text><rect width="38" height="34" x="32" y="202" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="51" y="225" fill="#7a8490" text-anchor="middle">06</text><rect width="38" height="34" x="76" y="202" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="95" y="225" fill="#7a8490" text-anchor="middle">07</text><rect width="38" height="34" x="120" y="202" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="139" y="225" fill="#7a8490" text-anchor="middle">08</text><rect width="38" height="34" x="164" y="202" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="183" y="225" fill="#7a8490" text-anchor="middle">09</text><rect width="38" height="34" x="208" y="202" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="227" y="225" fill="#7a8490" text-anchor="middle">10</text><rect width="38" height="34" x="252" y="202" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="271" y="225" fill="#7a8490" text-anchor="middle">11</text><rect width="38" height="34" x="32" y="244" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="51" y="267" fill="#7a8490" text-anchor="middle">12</text><rect width="38" height="34" x="76" y="244" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="95" y="267" fill="#7a8490" text-anchor="middle">13</text><rect width="38" height="34" x="120" y="244" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="139" y="267" fill="#7a8490" text-anchor="middle">14</text><rect width="38" height="34" x="164" y="244" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="183" y="267" fill="#7a8490" text-anchor="middle">15</text><rect width="38" height="34" x="208" y="244" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="227" y="267" fill="#7a8490" text-anchor="middle">16</text><rect width="38" height="34" x="252" y="244" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="271" y="267" fill="#7a8490" text-anchor="middle">17</text><rect width="38" height="34" x="32" y="286" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="51" y="309" fill="#7a8490" text-anchor="middle">18</text><rect width="38" height="34" x="76" y="286" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="95" y="309" fill="#7a8490" text-anchor="middle">19</text><rect width="38" height="34" x="120" y="286" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="139" y="309" fill="#7a8490" text-anchor="middle">20</text><rect width="38" height="34" x="164" y="286" fill="#edf2f8" stroke="#294f82" rx="3"/><text x="183" y="309" fill="#294f82" text-anchor="middle">21</text><rect width="38" height="34" x="208" y="286" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="227" y="309" fill="#7a8490" text-anchor="middle">22</text><rect width="38" height="34" x="252" y="286" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="271" y="309" fill="#7a8490" text-anchor="middle">23</text><rect width="38" height="34" x="32" y="328" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="51" y="351" fill="#7a8490" text-anchor="middle">24</text><rect width="38" height="34" x="76" y="328" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="95" y="351" fill="#7a8490" text-anchor="middle">25</text><rect width="38" height="34" x="120" y="328" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="139" y="351" fill="#7a8490" text-anchor="middle">26</text><rect width="38" height="34" x="164" y="328" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="183" y="351" fill="#7a8490" text-anchor="middle">27</text><rect width="38" height="34" x="208" y="328" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="227" y="351" fill="#7a8490" text-anchor="middle">28</text><rect width="38" height="34" x="252" y="328" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="271" y="351" fill="#7a8490" text-anchor="middle">29</text><rect width="38" height="34" x="32" y="370" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="51" y="393" fill="#7a8490" text-anchor="middle">30</text><rect width="38" height="34" x="76" y="370" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="95" y="393" fill="#7a8490" text-anchor="middle">31</text><rect width="38" height="34" x="120" y="370" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="139" y="393" fill="#7a8490" text-anchor="middle">32</text><rect width="38" height="34" x="164" y="370" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="183" y="393" fill="#7a8490" text-anchor="middle">33</text><rect width="38" height="34" x="208" y="370" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="227" y="393" fill="#7a8490" text-anchor="middle">34</text><rect width="38" height="34" x="252" y="370" fill="#fff" stroke="#e0e5e9" rx="3"/><text x="271" y="393" fill="#7a8490" text-anchor="middle">35</text><path stroke="#8191a2" stroke-width="2" marker-end="url(#arrow)" d="M 306 282 H 327"/><rect width="388" height="148" x="340" y="202" fill="#fafbfc" stroke="#e0e5e9" rx="5"/><text x="358" y="231" font-weight="600">Only one cell contributes to this sum</text><text x="358" y="262" fill="#294f82" font-family="monospace">code[21] = 55</text><text x="358" y="303" fill="#294f82" font-size="25" font-weight="600">55 → &apos;7&apos;</text><text x="358" y="333" fill="#5b6570">Position 21 in the flag must contain 7.</text><rect width="15" height="15" x="32" y="431" fill="#edf2f8" stroke="#294f82" rx="2"/><text x="56" y="444" fill="#5b6570">Selected: one cell</text><text x="340" y="437" fill="#5b6570">26 masks give 26 equations.</text><text x="340" y="459" fill="#5b6570">Solve them together to find the flag.</text></g></svg>