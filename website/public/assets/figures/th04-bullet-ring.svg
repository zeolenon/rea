<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" aria-labelledby="title description" role="img" viewBox="0 0 1000 520"><title id="title">TH04: spacing and aiming a ring of bullets</title><desc id="description">A full clockwise turn has 256 angle units. Sixteen bullets start at angles zero, sixteen, thirty-two, through 240. Adding an example player direction of forty turns all sixteen directions together; the first bullet points at the player. Template rotation is zero.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#294f82" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252b}.heading{font-size:26px;font-weight:600}.mono,.note{font-size:19px}.note{fill:#5b6570}.mono{font-family:Consolas,&apos;Liberation Mono&apos;,monospace}.accent{fill:#294f82}.spoke{stroke:#d2dbe4;stroke-width:1.6}.bullet{fill:#9eafc0}.first{fill:#294f82}@media (prefers-color-scheme:dark){svg{background-color:#181825}[fill=&quot;#20252b&quot;],text{fill:#cdd6f4}[fill=&quot;#294f82&quot;]{fill:#89b4fa}[stroke=&quot;#294f82&quot;]{stroke:#89b4fa}[stroke=&quot;#e0e5ea&quot;]{stroke:#45475a}[fill=&quot;#edf2f8&quot;]{fill:#313244}[fill=&quot;#ffffff&quot;]{fill:#181825}.note{fill:#a6adc8}.accent{fill:#89b4fa}.spoke{stroke:#6c7086}.bullet{fill:#9399b2}.first{fill:#89b4fa}}</style><rect width="1000" height="520" fill="#fff"/><line x1="500" x2="500" y1="42" y2="428" stroke="#e0e5ea"/><text x="42" y="58" class="heading">Fixed ring</text><text x="42" y="88" class="note">First bullet: angle 0</text><text x="542" y="58" class="heading">Aimed ring</text><text x="542" y="88" class="note">First bullet: player direction</text><g id="fixed-ring" data-aim="0" data-count="16"><circle cx="245" cy="246" r="118" fill="none" stroke="#e0e5ea" stroke-dasharray="3 5"/><line x1="245" x2="363" y1="246" y2="246" stroke="#294f82" stroke-width="2.5"/><circle cx="363" cy="246" r="6" class="first" data-angle="0" data-index="0"/><line x1="245" x2="354.018" y1="246" y2="291.157" class="spoke"/><circle cx="354.018" cy="291.157" r="4.5" class="bullet" data-angle="16" data-index="1"/><line x1="245" x2="328.439" y1="246" y2="329.439" class="spoke"/><circle cx="328.439" cy="329.439" r="4.5" class="bullet" data-angle="32" data-index="2"/><line x1="245" x2="290.157" y1="246" y2="355.018" class="spoke"/><circle cx="290.157" cy="355.018" r="4.5" class="bullet" data-angle="48" data-index="3"/><line x1="245" x2="245" y1="246" y2="364" class="spoke"/><circle cx="245" cy="364" r="4.5" class="bullet" data-angle="64" data-index="4"/><line x1="245" x2="199.843" y1="246" y2="355.018" class="spoke"/><circle cx="199.843" cy="355.018" r="4.5" class="bullet" data-angle="80" data-index="5"/><line x1="245" x2="161.561" y1="246" y2="329.439" class="spoke"/><circle cx="161.561" cy="329.439" r="4.5" class="bullet" data-angle="96" data-index="6"/><line x1="245" x2="135.982" y1="246" y2="291.157" class="spoke"/><circle cx="135.982" cy="291.157" r="4.5" class="bullet" data-angle="112" data-index="7"/><line x1="245" x2="127" y1="246" y2="246" class="spoke"/><circle cx="127" cy="246" r="4.5" class="bullet" data-angle="128" data-index="8"/><line x1="245" x2="135.982" y1="246" y2="200.843" class="spoke"/><circle cx="135.982" cy="200.843" r="4.5" class="bullet" data-angle="144" data-index="9"/><line x1="245" x2="161.561" y1="246" y2="162.561" class="spoke"/><circle cx="161.561" cy="162.561" r="4.5" class="bullet" data-angle="160" data-index="10"/><line x1="245" x2="199.843" y1="246" y2="136.982" class="spoke"/><circle cx="199.843" cy="136.982" r="4.5" class="bullet" data-angle="176" data-index="11"/><line x1="245" x2="245" y1="246" y2="128" class="spoke"/><circle cx="245" cy="128" r="4.5" class="bullet" data-angle="192" data-index="12"/><line x1="245" x2="290.157" y1="246" y2="136.982" class="spoke"/><circle cx="290.157" cy="136.982" r="4.5" class="bullet" data-