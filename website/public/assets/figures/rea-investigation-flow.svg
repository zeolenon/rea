<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" aria-labelledby="title desc" role="img" viewBox="0 0 1774 887"><title id="title">REA investigation flow</title><desc id="desc">Ask a question about a local target. REA inspects and traces through local analysis adapters, returns evidence, and supports follow-up questions as your agent explains, implements and tests.</desc><defs><marker id="arrow" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto-start-reverse" refX="8" refY="5"><path fill="none" stroke="#5b6570" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M1 1 L8 5 L1 9"/></marker><marker id="blue-arrow" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="9" refY="6"><path fill="none" stroke="#294f82" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M1 1 L9 6 L1 11"/></marker></defs><style>@media (prefers-color-scheme:dark){svg{background-color:#181825}[fill=&quot;#20252b&quot;]{fill:#cdd6f4}[fill=&quot;#294f82&quot;]{fill:#89b4fa}[stroke=&quot;#294f82&quot;]{stroke:#89b4fa}[fill=&quot;#5b6570&quot;]{fill:#a6adc8}[stroke=&quot;#5b6570&quot;]{stroke:#a6adc8}[stroke=&quot;#87929e&quot;]{stroke:#7f849c}[fill=&quot;#ffffff&quot;]{fill:#181825}}</style><rect width="1774" height="887" fill="#fff"/><g fill="#20252b" font-family="Arial, Helvetica, sans-serif"><text x="40" y="96" font-size="68" font-weight="700">REA investigation flow</text><g fill="none" stroke="#87929e" stroke-width="3.5"><rect width="384" height="255" x="28" y="282" rx="15"/><rect width="377" height="255" x="477" y="282" stroke="#294f82" rx="15"/><rect width="380" height="255" x="919" y="282" rx="15"/><rect width="382" height="255" x="1364" y="282" rx="15"/><rect width="425" height="205" x="453" y="617" rx="15"/></g><g text-anchor="middle"><text x="220" y="365" font-size="50" font-weight="700">1. Ask</text><text x="220" y="435" fill="#5b6570" font-size="31">Your agent + local target</text><text x="220" y="496" fill="#5b6570" font-size="31">App / binary / browser</text><text x="665" y="357" font-size="37" font-weight="700">2. Inspect &amp; trace</text><text x="665" y="454" fill="#294f82" font-size="80" font-weight="700">REA</text><text x="665" y="508" fill="#5b6570" font-size="35">CLI / MCP</text><text x="1109" y="363" font-size="35" font-weight="700">3. Read the evidence</text><text x="1109" y="438" fill="#5b6570" font-size="32">Code / references /</text><text x="1109" y="480" fill="#5b6570" font-size="32">unknowns</text><text x="1555" y="362" font-size="34" font-weight="700">4. Use what you learn</text><text x="1555" y="440" font-size="53" font-weight="700">Your agent</text><text x="1555" y="496" fill="#5b6570" font-size="30">Explain / implement / test</text><text x="665" y="690" font-size="42" font-weight="700">Analysis tools</text><text x="665" y="755" fill="#5b6570" font-size="32">Local analysis adapters</text><text x="1118" y="199" fill="#294f82" font-size="33" font-weight="700">Follow-up question</text></g></g><g fill="none" stroke="#5b6570" stroke-width="4" marker-end="url(#arrow)"><path d="M414 410 H469"/><path d="M856 410 H911"/><path d="M1301 410 H1356"/><path d="M665 615 V545"/></g><path fill="none" stroke="#294f82" stroke-width="4" marker-end="url(#blue-arrow)" d="M1555 280 V248 Q1555 217 1524 217 H696 Q665 217 665 248 V273"/></svg>