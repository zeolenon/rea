<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" aria-labelledby="title desc" role="img" viewBox="0 0 1774 887"><title id="title">DX-Ball sound-pan investigation</title><desc id="desc">REA provides the instruction, caller and byte-read evidence for one DX-Ball function. A stack input is multiplied by 1.5625, offset by 500, scaled, and converted to an integer. Maintained C is checked in 3,205 original-x86 cases and a separate 63-byte compiler replay.</desc><defs><marker id="arrow" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="11" refY="7"><path fill="#5b6570" d="M1 1 L11 7 L1 13 Z"/></marker></defs><style>@media (prefers-color-scheme:dark){svg{background-color:#181825}[fill=&quot;#20252b&quot;]{fill:#cdd6f4}[fill=&quot;#294f82&quot;]{fill:#89b4fa}[fill=&quot;#5b6570&quot;]{fill:#a6adc8}[stroke=&quot;#5b6570&quot;]{stroke:#a6adc8}[stroke=&quot;#6c7e8b&quot;]{stroke:#7f849c}[fill=&quot;#ffffff&quot;]{fill:#181825}}</style><rect width="1774" height="887" fill="#fff"/><g fill="#20252b" font-family="Arial, Helvetica, sans-serif"><text x="40" y="166" font-size="63" font-weight="700">DX-Ball sound-pan investigation</text><g fill="none" stroke="#6c7e8b" stroke-width="3"><rect width="237" height="131" x="40" y="293"/><rect width="1006" height="215" x="315" y="232"/><rect width="384" height="215" x="1353" y="232"/><rect width="165" height="102" x="338" y="303"/><rect width="167" height="102" x="538" y="303"/><rect width="163" height="102" x="740" y="303"/><rect width="177" height="102" x="938" y="303"/><rect width="153" height="102" x="1150" y="303"/><rect width="344" height="115" x="1375" y="298"/><rect width="303" height="131" x="267" y="514"/><rect width="251" height="169" x="1229" y="577"/><rect width="255" height="169" x="1498" y="577"/></g><g font-weight="700" text-anchor="middle"><text x="158" y="357" font-size="32">DXBALL.EXE</text><text x="158" y="396" fill="#5b6570" font-size="26">0x00406400</text><text x="818" y="282" fill="#294f82" font-size="43">REA</text><text x="420" y="347" font-size="33">Stack</text><text x="420" y="386" font-size="33">input x</text><text x="621" y="368" font-size="32">× 1.5625</text><text x="821" y="368" font-size="35">− 500.0</text><text x="1026" y="368" font-size="28">× pan_scale</text><text x="1226" y="347" font-size="32">Integer</text><text x="1226" y="386" font-size="32">return</text><text x="1545" y="279" fill="#294f82" font-size="30">Reconstructed function</text><text x="1547" y="372" font-size="43">Maintained C</text><text x="418" y="569" font-size="34">Brick-hit caller</text><text x="418" y="615" fill="#5b6570" font-size="28">20 + 30 × tile_x</text><text x="1354" y="632" font-size="30">Original code</text><text x="1354" y="670" font-size="30">comparison</text><text x="1354" y="717" fill="#5b6570" font-size="31">3,205 cases</text><text x="1625" y="632" font-size="28">VC4.0 build</text><text x="1625" y="670" font-size="30">comparison</text><text x="1625" y="717" fill="#5b6570" font-size="28">63 matching bytes</text></g></g><g fill="none" stroke="#5b6570" stroke-width="4" marker-end="url(#arrow)"><path d="M279 354 H332"/><path d="M505 354 H532"/><path d="M707 354 H734"/><path d="M905 354 H932"/><path d="M1117 354 H1144"/><path d="M1305 354 H1369"/><path d="M420 512 V411"/><path d="M1547 415 V496 H1354 V571"/><path d="M1547 496 H1625 V571"/></g></svg>